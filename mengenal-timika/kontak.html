<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengenal Timika - Kontak</title>
</head>
<body>
    <header>
        <h1>Kontak</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="artikel.html">Artikel</a></li>
                <li><a href="kontak.html">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Hubungi Kami</h2>
            <form action="#" method="post">
                <p>
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <fieldset>
                    <legend>Apakah Anda Pernah Berkunjung ke Timika?</legend>
                    <p>
                        <input type="radio" id="pernah" name="kunjungan" value="pernah" required>
                        <label for="pernah">Pernah</label>
                    </p>
                    <p>
                        <input type="radio" id="belum" name="kunjungan" value="belum">
                        <label for="belum">Belum Pernah</label>
                    </p>
                </fieldset>

                <p>
                    <button type="submit">Kirim</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mengenal Timika</p>
    </footer>
</body>
</html>
